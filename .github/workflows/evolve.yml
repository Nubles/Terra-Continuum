name: Evolve Terra Continuum
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
permissions:
  contents: write
jobs:
  evolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run evolve
      - run: npm run validate
      - run: npm run generate:site-data
      - run: git config user.name 'terra-continuum-bot' && git config user.email 'bot@users.noreply.github.com' && git add data history web/public/data && git diff --staged --quiet || (git commit -m "evolve: generation $(node -p \"require('./data/current-world.json').meta.generation\")" && git push)
